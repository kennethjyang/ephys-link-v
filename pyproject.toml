[project]
name = "ephys-link"
version = "5.1.0.dev2"
description = "Electrophysiology manipulator communication platform."
readme = "README.md"
authors = [
    { name = "Kenneth Yang", email = "kenneth.yang@is88.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]==0.162.0",
    "httpx>=0.28.1",
    "pydantic==2.14.1",
    "sensapex==1.504.3",
    "typer>=0.27.3",
    "uvicorn==0.54.0",
]

[project.scripts]
el = "ephys_link.main:app"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore:.*Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning",
    "ignore:.*The anyio.abc.BlockingPortal alias:DeprecationWarning",
]

[tool.ruff]
fix = true

[tool.ruff.lint]
ignore = ["BLE001"]

[tool.pyrefly]
project-includes = [
    "**/*.py*",
    "**/*.ipynb",
]
preset = "strict"

[dependency-groups]
dev = [
    "lefthook>=2.2.2",
    "pyinstaller>=6.22.3",
    "pyrefly>=1.4.0",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.17.0",
    "ruff>=0.17.3",
]
