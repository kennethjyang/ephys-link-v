[project]
name = "ephys-link"
version = "5.1.0.dev1"
description = "Electrophysiology manipulator communication platform."
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
fix = true

[tool.pyrefly]
project-includes = [
    "**/*.py*",
    "**/*.ipynb",
]
preset = "strict"


[dependency-groups]
dev = [
    "lefthook>=2.1.9",
    "pyrefly>=1.1.1",
    "ruff>=0.15.20",
]
