[project]
name = "ephys-link"
version = "5.1.0.dev2"
description = "Electrophysiology manipulator communication platform."
readme = "README.md"
authors = [
    { name = "Kenneth Yang", email = "kenneth.yang@is88.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]==0.142.2",
    "pydantic==2.13.5",
    "sensapex==1.504.3",
    "typer>=0.27.2",
    "uvicorn==0.54.0",
]

[project.scripts]
el = "ephys_link.main:app"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
fix = true

[tool.ruff.lint]
ignore = ["BLE001"]

[tool.pyrefly]
project-includes = [
    "**/*.py*",
    "**/*.ipynb",
]
preset = "strict"

[dependency-groups]
dev = [
    "lefthook>=2.1.15",
    "pyinstaller>=6.22.3",
    "pyrefly>=1.3.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.16.0",
    "ruff>=0.16.9",
]
